# =================================================================
# NGINX CONFIGURATION FOR REACT VITE APPLICATION
# Production-ready SPA routing with caching strategies
# =================================================================

# Cache settings
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_cache:10m;

# Redirect HTTP to HTTPS (optional - remove if not needed)
# server {
#     listen 80;
#     server_name _;
#     return 301 https://$server_name$request_uri;
# }

# Main server block
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    client_max_body_size 10M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml application/atom+xml image/svg+xml 
               text/x-component text/x-cross-domain-policy;
    gzip_disable "msie6";

    # Root directory
    root /usr/share/nginx/html;
    index index.html index.htm;

    # ===== STATIC FILES CACHING =====
    # Images, fonts, JS/CSS with long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Version-specific static assets (Vite hashed files)
    location ~* ^/assets/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ===== DYNAMIC ROUTES - SPA FALLBACK =====
    # All non-file requests route to index.html for React Router
    location / {
        # First try to serve the file directly
        try_files $uri $uri/ /index.html;
        
        # Cache control for HTML (must be revalidated)
        add_header Cache-Control "public, max-age=0, must-revalidate";
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
    }

    # ===== DENY ACCESS TO SENSITIVE FILES =====
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ===== LOGGING =====
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
